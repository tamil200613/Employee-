{% extends "base.html" %}
{% block content %}
<h2>📋 Employee List</h2>

<form method="GET" action="{{ url_for('index') }}" class="input-group mb-3">
    <input type="text" name="q" class="form-control" placeholder="Search by ID or Name" value="{{ query or '' }}">
    <button class="btn btn-info" type="submit">Search</button>
</form>

<a href="{{ url_for('add_employee') }}" class="btn btn-success mb-3">Add Employee</a>

<table class="table table-bordered table-dark table-hover">
    <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Phone</th><th>Designation</th><th>Salary</th><th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for emp in employees %}
        <tr>
            <td>{{ emp[0] }}</td>
            <td>{{ emp[1] }}</td>
            <td>{{ emp[2] }}</td>
            <td>{{ emp[3] }}</td>
            <td>{{ emp[4] }}</td>
            <td>
                <a href="{{ url_for('update_employee', emp_id=emp[0]) }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{{ url_for('delete_employee', emp_id=emp[0]) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this employee?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
